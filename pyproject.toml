[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greenfin"
version = "0.1.0"
description = "News selection for efficient financial market prediction"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Ismail ELBOUKNIFY" }
]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
  "torch>=2.2",
  "transformers>=4.40,<5",
  "tqdm>=4.66,<5",
  "codecarbon>=2.3,<3",
  "PyYAML>=6.0,<7",
  "yfinance>=0.2,<1",
  "huggingface_hub>=0.23,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]